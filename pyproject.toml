[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heatequity"
version = "0.1.0"
description = "Urban heat and greenness disparities by census tract with Google Earth Engine and Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rajib Hossain" }]
dependencies = ["numpy>=1.22", "pandas>=1.5", "matplotlib>=3.6", "tabulate>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
